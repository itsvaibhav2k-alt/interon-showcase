version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - '@next/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      typescript:
        patterns:
          - 'typescript'
          - '@typescript-eslint/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      radix:
        patterns:
          - '@radix-ui/*'
      i18next:
        patterns:
          - 'i18next'
          - 'react-i18next'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    labels:
      - dependencies
      - github-actions
